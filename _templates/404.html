<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="theme-color" content="#0B0A10">
{{ROBOTS}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Archivo:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{BASE}}assets/site.css">

</head>
<body>

<header>

</header>

<main>

    <div class="beam" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="edition">404 — NOT FOUND</p>
      <h1>お探しのページは<span class="l2">見つかりませんでした</span></h1>
      <p class="sec-sub" style="margin-top:20px">The page you are looking for could not be found.</p>
      <div class="hero-cta" style="margin-top:36px">
        <a class="btn btn-fill" href="{{HOME_URL}}">開催中のイベント / Current Event</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="f-sns">{{SNS}}</div>
  <p class="copy">© {{SITE_NAME}}</p>
</footer>
</body>
</html>
