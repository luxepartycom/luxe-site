<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#0B0A10">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
{{ROBOTS}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OGP}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Archivo:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="{{BASE}}favicon.svg">
<link rel="stylesheet" href="{{BASE}}assets/site.css">
{{ANALYTICS}}
</head>
<body>

<header>
  <a class="brand" href="{{LANG_ROOT}}">{{BRAND_HTML}}</a>
  <nav class="desk">{{NAV}}</nav>
  <div class="head-right">{{LANG_SWITCH}}{{HEADER_CTA}}</div>
</header>

<main>
  <section class="sec reveal" style="padding-top:clamp(120px,18vw,180px)">
    <span class="eyebrow">{{ARCHIVE_EYEBROW}}</span>
    <h2 class="sec-title">{{ARCHIVE_TITLE}}</h2>
    <p class="sec-sub">{{ARCHIVE_SUB}}</p>
    {{WALL}}
  </section>
</main>

<footer>
  <div class="f-sns">{{SNS}}</div>
  <div class="f-links">{{FOOTER_LINKS}}</div>
  <p class="copy">© {{SITE_NAME}}</p>
</footer>

<script>
(function(){
  var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var header = document.querySelector("header");
  var prog = document.createElement("div"); prog.className = "scroll-progress";
  document.body.appendChild(prog);
  var ticking = false;
  function onScroll(){
    var st = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (header) header.classList.toggle("scrolled", st > 40);
    var h = (document.documentElement.scrollHeight - window.innerHeight);
    prog.style.transform = "scaleX(" + (h > 0 ? Math.min(st / h, 1) : 0) + ")";
    ticking = false;
  }
  function req(){ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }
  onScroll();
  window.addEventListener("scroll", req, { passive:true });
  window.addEventListener("resize", req, { passive:true });

  function cascade(sec){
    var items = sec.querySelectorAll(".wall-card");
    for (var i = 0; i < items.length; i++){
      items[i].style.transitionDelay = (rm ? 0 : Math.min(i * 0.045, 0.6)) + "s";
    }
  }
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ cascade(e.target); e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: .06, rootMargin: "0px 0px -4% 0px" });
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
  }

  /* 動画音声：動画ごとに右端固定の音声ボタン。鳴らせるのは常に1つだけ（他は自動ミュート）。 */
  (function(){
    var vids = Array.prototype.slice.call(document.querySelectorAll("video"));
    if(!vids.length) return;
    var cur = null;
    var ICON_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3.4L12 18.5V5.5L7.4 9H4z" fill="currentColor" stroke="none"/><line x1="16.5" y1="9.5" x2="21" y2="14.5"/><line x1="21" y1="9.5" x2="16.5" y2="14.5"/></svg>';
    var ICON_ON  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3.4L12 18.5V5.5L7.4 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 9.2a3.6 3.6 0 0 1 0 5.6"/><path d="M19 6.8a7.2 7.2 0 0 1 0 10.4"/></svg>';
    function refresh(){ for(var i=0;i<vids.length;i++){ var b=vids[i]._sb; if(b){ var on=(vids[i]===cur); b.setAttribute("aria-pressed",on?"true":"false"); b.innerHTML = on?ICON_ON:ICON_OFF; } } }
    function setAudio(v){
      for(var i=0;i<vids.length;i++){ if(vids[i]!==v){ vids[i].muted = true; vids[i].removeAttribute("data-audio"); } }
      if(v){ v.muted = false; try{ var p = v.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} v.setAttribute("data-audio","on"); }
      cur = v || null; refresh();
    }
    function muteAll(){ setAudio(null); }
    window.__luxeAudio = { set:setAudio, muteAll:muteAll, current:function(){ return cur; } };
    for(var j=0;j<vids.length;j++){ (function(v){
      var btn = document.createElement("button");
      btn.type="button"; btn.className="vid-sound"; btn.innerHTML=ICON_OFF;
      btn.setAttribute("aria-label","この動画の音声のオン・オフ"); btn.setAttribute("aria-pressed","false");
      btn.addEventListener("click", function(ev){ ev.stopPropagation(); if(cur===v){ muteAll(); } else { setAudio(v); } });
      var host = v.closest(".reel, .wall-card") || v.parentNode;
      if(host){ if(window.getComputedStyle && getComputedStyle(host).position==="static") host.style.position="relative"; host.appendChild(btn); }
      v._sb = btn;
    })(vids[j]); }
  })();
})();
</script>
</body>
</html>
