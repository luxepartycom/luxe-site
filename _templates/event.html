<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#0B0A10">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
{{ROBOTS}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OGP}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Archivo:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="{{BASE}}favicon.svg">
<link rel="stylesheet" href="{{BASE}}assets/site.css">
{{ANALYTICS}}
{{JSONLD}}
</head>
<body>

<header>
  <a class="brand" href="{{LANG_ROOT}}">{{BRAND_HTML}}</a>
  <nav class="desk">{{NAV}}</nav>
  <div class="head-right">{{LANG_SWITCH}}{{HEADER_CTA}}</div>
</header>

<main>
  <section class="hero">
    {{HERO_MEDIA}}
    <div class="beam" aria-hidden="true"></div>
    <div class="hero-inner">
      {{ENDED_BADGE}}
      <p class="edition">{{EDITION}}</p>
      <h1>{{H1}}</h1>
      <dl class="facts">{{FACTS}}</dl>
      <div class="hero-cta">{{HERO_CTA}}</div>
    </div>
  </section>

{{BLOCKS}}
</main>

<footer>
  <div class="f-sns">{{SNS}}</div>
  <div class="f-links">{{FOOTER_LINKS}}</div>
  <p class="copy">© {{SITE_NAME}}</p>
</footer>

{{STICKY_CTA}}

<script>
(function(){
  var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  /* スクロール進捗バー＋ヘッダー凝縮 */
  var header = document.querySelector("header");
  var prog = document.createElement("div"); prog.className = "scroll-progress";
  document.body.appendChild(prog);
  var ticking = false;
  function onScroll(){
    var st = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (header) header.classList.toggle("scrolled", st > 40);
    var h = (document.documentElement.scrollHeight - window.innerHeight);
    prog.style.transform = "scaleX(" + (h > 0 ? Math.min(st / h, 1) : 0) + ")";
    ticking = false;
  }
  function req(){ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }
  onScroll();
  window.addEventListener("scroll", req, { passive:true });
  window.addEventListener("resize", req, { passive:true });

  /* 段階リビール＋グリッドのカスケード（見出し→本文→カードが順に立ち上がる） */
  function cascade(sec){
    var items = sec.querySelectorAll(".lineup .artist, .tables .table-card, .pastgrid > *, .gallery a, .wall-card");
    for (var i = 0; i < items.length; i++){
      items[i].style.transitionDelay = (rm ? 0 : Math.min(i * 0.05, 0.7)) + "s";
    }
  }
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ cascade(e.target); e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: .12, rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
  }

  /* 画像タップで拡大（フライヤー・出演者写真・図版）。リンク済み画像は除外。 */
  var sel = ".text-flyer, .artist-photo, .figure img";
  var box = document.createElement("div"); box.className = "lightbox";
  var big = document.createElement("img"); box.appendChild(big);
  box.addEventListener("click", function(){ box.classList.remove("open"); });
  document.body.appendChild(box);
  document.addEventListener("click", function(e){
    var img = e.target.closest ? e.target.closest(sel) : null;
    if(!img || img.tagName !== "IMG" || img.closest("a")) return;
    e.preventDefault();
    big.src = img.currentSrc || img.src;
    box.classList.add("open");
  });
})();
</script>
</body>
</html>
