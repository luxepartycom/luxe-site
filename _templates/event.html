<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#0B0A10">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
{{ROBOTS}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{OGP}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Archivo:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{BASE}}assets/site.css">
{{ANALYTICS}}
</head>
<body>

<header>
  <a class="brand" href="{{LANG_ROOT}}">{{BRAND_HTML}}</a>
  <nav class="desk">{{NAV}}</nav>
  <div class="head-right">{{LANG_SWITCH}}{{HEADER_CTA}}</div>
</header>

<main>
  <section class="hero">
    {{HERO_MEDIA}}
    <div class="beam" aria-hidden="true"></div>
    <div class="hero-inner">
      {{ENDED_BADGE}}
      <p class="edition">{{EDITION}}</p>
      <h1>{{H1}}</h1>
      <dl class="facts">{{FACTS}}</dl>
      <div class="hero-cta">{{HERO_CTA}}</div>
    </div>
  </section>

{{BLOCKS}}
</main>

<footer>
  <div class="f-sns">{{SNS}}</div>
  <div class="f-links">{{FOOTER_LINKS}}</div>
  <p class="copy">© {{SITE_NAME}}</p>
</footer>

{{STICKY_CTA}}

<script>
var io = new IntersectionObserver(function(es){
  es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: .12 });
document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
</script>
</body>
</html>
