<script>
(function(){
  var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  /* スクロール進捗バー＋ヘッダー凝縮 */
  var header = document.querySelector("header");
  var prog = document.createElement("div"); prog.className = "scroll-progress";
  document.body.appendChild(prog);
  var ticking = false;
  function onScroll(){
    var st = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (header) header.classList.toggle("scrolled", st > 40);
    var h = (document.documentElement.scrollHeight - window.innerHeight);
    prog.style.transform = "scaleX(" + (h > 0 ? Math.min(st / h, 1) : 0) + ")";
    ticking = false;
  }
  function req(){ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }
  onScroll();
  window.addEventListener("scroll", req, { passive:true });
  window.addEventListener("resize", req, { passive:true });

  /* 段階リビール＋グリッドのカスケード（見出し→本文→カードが順に立ち上がる） */
  function cascade(sec){
    var items = sec.querySelectorAll(".lineup .artist, .tables .table-card, .pastgrid > *, .gallery a, .wall-card");
    for (var i = 0; i < items.length; i++){
      items[i].style.transitionDelay = (rm ? 0 : Math.min(i * 0.05, 0.7)) + "s";
    }
  }
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ cascade(e.target); e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: .12, rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
  }

  /* 画像タップで拡大（フライヤー・出演者写真・図版）。リンク済み画像は除外。 */
  var sel = ".text-flyer, .artist-photo, .figure img";
  var box = document.createElement("div"); box.className = "lightbox";
  var big = document.createElement("img"); box.appendChild(big);
  box.addEventListener("click", function(){ box.classList.remove("open"); });
  document.body.appendChild(box);
  document.addEventListener("click", function(e){
    var img = e.target.closest ? e.target.closest(sel) : null;
    if(!img || img.tagName !== "IMG" || img.closest("a")) return;
    e.preventDefault();
    big.src = img.currentSrc || img.src;
    box.classList.add("open");
  });

  /* 動画音声：常に1つだけ再生（他は自動ミュート＝同時再生を構造的に禁止）。
     ヒーロー=🔊ボタンのタップで開始／スクロールで画面外に出たら停止。過去リール等=タップで音声トグル。
     ※ブラウザの自動再生ポリシー上、音声つき自動再生は不可＝必ずユーザー操作(タップ)が起点。 */
  (function(){
    var vids = Array.prototype.slice.call(document.querySelectorAll("video"));
    if(!vids.length) return;
    var hero = document.querySelector("video.hero-vid");
    var heroBtn = null, cur = null;
    function setAudio(v){
      for(var i=0;i<vids.length;i++){ if(vids[i]!==v){ vids[i].muted = true; vids[i].removeAttribute("data-audio"); } }
      if(v){ v.muted = false; try{ var p = v.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} v.setAttribute("data-audio","on"); }
      cur = v || null;
      if(heroBtn){ var on = (cur===hero); heroBtn.setAttribute("aria-pressed", on?"true":"false"); heroBtn.textContent = on?"🔊":"🔈"; }
    }
    function muteAll(){ setAudio(null); }
    window.__luxeAudio = { set:setAudio, muteAll:muteAll, current:function(){ return cur; } }; /* ハーネス検証用フック */

    /* ヒーロー：音声トグルボタン＋スクロールアウトで停止 */
    if(hero){
      heroBtn = document.createElement("button");
      heroBtn.type="button"; heroBtn.className="vid-sound"; heroBtn.textContent="🔈";
      heroBtn.setAttribute("aria-label","ヒーロー動画の音声のオン・オフ"); heroBtn.setAttribute("aria-pressed","false");
      heroBtn.addEventListener("click", function(ev){ ev.stopPropagation(); if(cur===hero){ muteAll(); } else { setAudio(hero); } });
      var heroSec = hero.closest("section") || hero.parentNode;
      if(heroSec){ if(window.getComputedStyle && getComputedStyle(heroSec).position === "static") heroSec.style.position="relative"; heroSec.appendChild(heroBtn); }
      if("IntersectionObserver" in window){
        new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting && cur===hero){ muteAll(); } }); }, { threshold:0.35 }).observe(hero);
      }
    }
    /* 過去リール等（ヒーロー以外の全動画）：タップで音声トグル（1つずつ） */
    for(var j=0;j<vids.length;j++){ (function(v){
      if(v===hero) return;
      v.style.cursor="pointer";
      v.addEventListener("click", function(){ if(cur===v){ muteAll(); } else { setAudio(v); } });
    })(vids[j]); }
  })();
})();
</script>
